name: CI — Build, Test & Security Scan (.NET 10 LTS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore SerialLogHub.sln

      - name: Build solution (Release)
        run: dotnet build SerialLogHub.sln --configuration Release --no-restore

      - name: Run unit, integration, simulator & security tests
        run: dotnet test SerialLogHub.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: "**/TestResults/*.trx"

      - name: Audit NuGet dependencies for vulnerabilities
        run: dotnet list SerialLogHub.sln package --vulnerable --include-transitive

      - name: Verify production publish artifacts (API & Web)
        run: |
          dotnet publish src/SerialLogHub.Api/SerialLogHub.Api.csproj -c Release -o ./artifacts/api --no-build
          dotnet publish src/SerialLogHub.Web/SerialLogHub.Web.csproj -c Release -o ./artifacts/web --no-build
